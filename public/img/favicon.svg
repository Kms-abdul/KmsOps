<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KMS Ops — Key Management Solutions">
  <!-- KMS Ops mark: a person reaching up, wrapped by an orbit, with a star -->
  <defs>
    <linearGradient id="kms-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC24B"/>
      <stop offset="1" stop-color="#F57C1F"/>
    </linearGradient>
    <linearGradient id="kms-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FB8FF"/>
      <stop offset="1" stop-color="#1D6FE0"/>
    </linearGradient>
    <linearGradient id="kms-orbit" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1D6FE0"/>
      <stop offset="1" stop-color="#4FB8FF"/>
    </linearGradient>
  </defs>
  <!-- orbit, back part (behind the figure) -->
  <path d="M58 25 C55 19 42 22 26 30" fill="none" stroke="url(#kms-orbit)" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>
  <!-- figure -->
  <path d="M13 15.5 Q22 20.5 28.5 26.5 Q32.5 29 36.5 26.5 Q45 19.5 57 12.5 Q55 23.5 42.5 33.5 Q39.5 41 42.5 55.5 Q38.5 59 34.5 56 Q32 47.5 30.5 43.5 Q27.5 50 23 58.5 Q18.5 58 19.5 54 Q24 44 24 35.5 Q15 27 13 15.5 Z" fill="url(#kms-body)"/>
  <circle cx="33" cy="15" r="7.2" fill="url(#kms-head)"/>
  <!-- orbit, front swoosh (tapered) -->
  <path d="M5 44 C7 53 25 54 43 43 C51 38 57 32 58.5 25 C55.5 31 49 36.5 41 40.5 C26 48 11 50 5 44 Z" fill="url(#kms-orbit)"/>
  <!-- star -->
  <path d="M8.5 1.5 l2 4.1 4.5 .65 -3.25 3.2 .77 4.5 -4.02 -2.12 -4.02 2.12 .77 -4.5 -3.25 -3.2 4.5 -.65 Z" fill="#F7931E"/>
</svg>
