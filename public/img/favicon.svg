<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KMS — Key Management Solutions">
  <!-- KMS mark: a key (management) inside an orbit (connected solutions) with a star (excellence) -->
  <defs>
    <linearGradient id="kms-orbit" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#14A3A3"/>
      <stop offset="1" stop-color="#4F5BD5"/>
    </linearGradient>
    <linearGradient id="kms-key" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F2785C"/>
      <stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <radialGradient id="kms-hub" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#7C88F0"/>
      <stop offset="1" stop-color="#3E4BC4"/>
    </radialGradient>
  </defs>
  <g transform="rotate(-24 32 36)">
    <!-- orbit, back half -->
    <path d="M4 36 A28 11 0 0 1 60 36" fill="none" stroke="url(#kms-orbit)" stroke-width="3.8" stroke-linecap="round" opacity=".5"/>
  </g>
  <!-- key, tilted up to the right -->
  <g transform="rotate(-40 22 41)">
    <path d="M30 37.8 H55.5 a3.2 3.2 0 0 1 0 6.4 H53 v5.6 a2.6 2.6 0 0 1 -5.2 0 V44.2 H45.2 v4 a2.6 2.6 0 0 1 -5.2 0 V44.2 H30 Z" fill="url(#kms-key)"/>
  </g>
  <circle cx="22" cy="41" r="13" fill="url(#kms-key)"/>
  <circle cx="22" cy="41" r="6" fill="url(#kms-hub)"/>
  <g transform="rotate(-24 32 36)">
    <!-- orbit, front half, with connected-module nodes -->
    <path d="M60 36 A28 11 0 0 1 4 36" fill="none" stroke="url(#kms-orbit)" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="46" cy="45.4" r="3" fill="#14A3A3" stroke="#fff" stroke-width="1.5"/>
    <circle cx="13" cy="44.3" r="2.6" fill="#4F5BD5" stroke="#fff" stroke-width="1.5"/>
  </g>
  <!-- star -->
  <path d="M12 4 l2.3 4.6 5.1 .75 -3.7 3.6 .87 5.1 -4.57 -2.4 -4.57 2.4 .87 -5.1 -3.7 -3.6 5.1 -.75 Z" fill="#F2785C"/>
</svg>
